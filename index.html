<body>
<div id="app">
  <header id="hud">
    <div class="lv">Fase<b id="lv">1</b></div>
    <div class="goal">
      <div class="bar"><i id="b0"></i><i id="b1"></i></div>
      <div class="gt">Equipe <span id="sc">0</span> / <span id="tg">0</span></div>
    </div>

  </header>
  <div id="players"></div>
  <div id="bossBanner" aria-live="polite"><div class="bossAvatar" id="bossAvatar">🍎</div><div class="bossInfo"><div class="bossKicker">Chefe da fase</div><div class="bossName" id="bossName">Rei Maçã</div><div class="bossDesc" id="bossDesc">O rei chegou para desafiar a equipe!</div></div><div class="bossTag">CHEFE</div></div>
  <canvas id="board"></canvas>
  <div id="inventory" aria-label="Inventário">
    <button class="inv" data-item="rocket"><b>🚀 <span id="invRocket">0</span></b>Foguete<small>Linha + coluna</small></button>
    <button class="inv" data-item="bomb"><b>💣 <span id="invBomb">0</span></b>Bomba<small>Explosão ao redor</small></button>
    <button class="inv" data-item="rainbow"><b>🌈 <span id="invRainbow">0</span></b>Arco-íris<small>Escolha uma cor</small></button>
  </div>
  <div id="relicEnergy" style="font-size:10px;text-align:center;opacity:.9">Energia individual — Você: <span id="relEnergy0">0</span>% · Parceiro: <span id="relEnergy1">0</span>%</div>
  <div id="relicInfo" class="relicInfo">Toque em uma relíquia para ver o efeito. Com 25% de energia, selecione-a e toque em uma fruta.</div>
  <div id="relics"><button class="relic" data-relic="apple"><b>🍎 <span id="relApple">0</span></b>Maçã</button><button class="relic" data-relic="grape"><b>🍇 <span id="relGrape">0</span></b>Uva</button><button class="relic" data-relic="orange"><b>🍊 <span id="relOrange">0</span></b>Laranja</button><button class="relic" data-relic="kiwi"><b>🥝 <span id="relKiwi">0</span></b>Kiwi</button><button class="relic" data-relic="blueberry"><b>🫐 <span id="relBlueberry">0</span></b>Mirtilo</button></div>
</div>
<div id="overlay"></div>

<script>
'use strict';
/* =========================================================
   Fruta Duo — puzzle de frutas cooperativo para 2 jogadores
   - Solo / mesmo celular (multitoque)
   - 2 celulares via WebRTC direto (mesma rede Wi-Fi, sem servidor)
   ========================================================= */
const COLS = 8, ROWS = 9;
const SP = {NONE:0, ROCKET_H:1, ROCKET_V:2, BOMB:3, RAINBOW:4};
const P_COLOR = ['#36d1dc', '#ff6fae'];
const FRUIT_COLOR = ['#e53935','#fb8c00','#8e24aa','#fdd835','#1e88e5','#7cb342'];
const DUO_WINDOW = 1200;     // ms: toques dos dois dentro desse tempo = bônus DUO
const DUO_MULT = 1.5;

/* ---------- utilidades ---------- */
function mulberry32(a){
  let state = a >>> 0;
  const fn = function(){ state = (state + 0x6D2B79F5) >>> 0; let t=state; t=Math.imul(t^t>>>15,1|t); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  fn.getState = ()=>state; fn.setState = v=>{ state=(v>>>0); };
  return fn;
}

function floodIdx(getC, start){
  const c0 = getC(start); if (c0 < 0) return [];
  const seen = new Uint8Array(COLS*ROWS), out = [start], st = [start]; seen[start]=1;
  while (st.length){
    const i = st.pop(), c = i%COLS, r = (i/COLS)|0;
    const nb = [];
    if (c>0) nb.push(i-1); if (c<COLS-1) nb.push(i+1);
    if (r>0) nb.push(i-COLS); if (r<ROWS-1) nb.push(i+COLS);
    for (const j of nb) if (!seen[j] && getC(j)===c0){ seen[j]=1; out.push(j); st.push(j); }
  }
  return out;
}

/* ---------- regras do jogo (host / solo) ---------- */
class Game {
  constructor(seed, solo){
    this.rng = mulberry32(seed || (Date.now() & 0x7fffffff));
    this.solo = !!solo;   // sem parceiro não há bônus DUO, então a meta é menor
    this.nextId = 1; this.lastAct = [-1e9,-1e9];
    this.inventory = {rocket:0,bomb:0,rainbow:0};
    this.relics={apple:0,grape:0,orange:0,kiwi:0,blueberry:0};this.energy=[0,0];this.scoreBoost=0;this.boostCombos=0;
    this.start(1);
  }
  cfg(level){
    const nc = Math.min(6, 4 + Math.floor((level-1)/3));
    const moves = Math.max(16, 26 - Math.floor((level-1)/2));
    let perMove = Game.BASE_PER_MOVE + (level-1)*Game.STEP_PER_MOVE;
    if (nc >= 6) perMove *= 0.88;   // com 6 cores fica mais difícil juntar grupos
    const k = this.solo ? Game.SOLO_FACTOR : 1;
    return {nc, moves, target: Math.round(moves*perMove*k/10)*10};
  }
  start(level){
    const k = this.cfg(level);
    this.level = level; this.nc = k.nc; this.moves = k.moves; this.target = k.target;
    this.score = 0; this.ps = [0,0]; this.status = 'play';
    this.grid = [];
    do {
      this.grid = [];
      for (let i=0;i<COLS*ROWS;i++) this.grid.push(this.newCell());
    } while (!this.hasMove());
    this.placeObstacles();
    this.ensureMove();
  }
  placeObstacles(){
    // Introdução gradual: caixas a partir da fase 4, gelo na 8 e pedras na 12.
    const spots = this.level>=4 ? [11,20,43,52] : [];
    for (const i of spots) if (this.grid[i] && !this.grid[i].s) {
      this.grid[i] = {id:this.nextId++, c:-1, s:0, o:1, hp:2};
    }
    if (this.level>=8) for (const i of [6,17,30,49,62]) {
      const g=this.grid[i]; if (g && g.c>=0 && !g.s) g.o=2;
    }
    if (this.level>=12) for (const i of [3,28,39,60]) {
      this.grid[i] = {id:this.nextId++, c:-1, s:0, o:3, hp:0};
    }
  }
  newCell(){ return {id:this.nextId++, c:Math.floor(this.rng()*this.nc), s:0, o:0, hp:0}; }
  ensureMove(){
    if(this.hasMove())return;
    this.reshuffle();
    if(this.hasMove())return;
    // Garante ao menos um par adjacente jogável, mesmo com pedras/caixas na fase 12+.
    for(let i=0;i<this.grid.length;i++){
      const a=this.grid[i];
      if(!a||a.o===1||a.o===3||a.c<0)continue;
      const c=i%COLS;
      for(const j of [c<COLS-1?i+1:-1,i+COLS<this.grid.length?i+COLS:-1]){
        if(j<0)continue;
        const b=this.grid[j];
        if(b&&b.o!==1&&b.o!==3&&b.c>=0){b.c=a.c;return;}
      }
    }
    // Caso extremo: reconfigura duas casas livres sem remover os obstáculos.
    const free=this.grid.map((g,i)=>({g,i})).filter(x=>x.g&&x.g.o!==1&&x.g.o!==3&&x.g.c>=0);
    for(let a=0;a<free.length;a++)for(let b=a+1;b<free.length;b++){
      const x=free[a].i,y=free[b].i;
      if(Math.abs(x%COLS-y%COLS)+Math.abs(Math.floor(x/COLS)-Math.floor(y/COLS))===1){
        free[b].g.c=free[a].g.c;return;
      }
    }
  }
  hasMove(){
    for (let i=0;i<this.grid.length;i++){
      const g = this.grid[i]; if (g.o===3 || g.o===1 || g.c<0) continue; if (g.s) return true;
      const c = i%COLS;
      if (c<COLS-1 && this.grid[i+1].o!==3 && this.grid[i+1].o!==1 && this.grid[i+1].c===g.c) return true;
      if (i+COLS<this.grid.length && this.grid[i+COLS].o!==3 && this.grid[i+COLS].o!==1 && this.grid[i+COLS].c===g.c) return true;
    }
    return false;
  }
  indexOfId(id){ for (let i=0;i<this.grid.length;i++) if (this.grid[i].id===id) return i; return -1; }
  mostCommonColor(){
    const cnt = new Array(6).fill(0);
    for (const g of this.grid) if (g.c>=0) cnt[g.c]++;
    let best = 0; for (let i=1;i<6;i++) if (cnt[i]>cnt[best]) best = i;
    return best;
  }
  expand(initial){
    const out = new Set(initial), queue = [...initial];
    while (queue.length){
      const i = queue.pop(), cell = this.grid[i];
      if (!cell || !cell.s) continue;
      const c = i%COLS, r = (i/COLS)|0, add = [];
      if (cell.s===SP.ROCKET_H) for (let cc=0;cc<COLS;cc++) add.push(r*COLS+cc);
      else if (cell.s===SP.ROCKET_V) for (let rr=0;rr<ROWS;rr++) add.push(rr*COLS+c);
      else if (cell.s===SP.BOMB){
        for (let rr=0;rr<ROWS;rr++) for (let cc=0;cc<COLS;cc++)
          if (Math.abs(rr-r)+Math.abs(cc-c) <= 2) add.push(rr*COLS+cc);
      } else if (cell.s===SP.RAINBOW){
        const col = this.mostCommonColor();
        for (let j=0;j<this.grid.length;j++) if (this.grid[j].c===col) add.push(j);
      }
      for (const j of add) if (!out.has(j)){ out.add(j); queue.push(j); }
    }
    return out;
  }
  /* sig = c*10+s que o jogador viu; evita acionar algo que mudou no meio do caminho */
  tap(id, player, now, sig){
    if (this.status !== 'play') return null;
    const i = this.indexOfId(id); if (i<0) return null;
    const cell = this.grid[i];
    if (sig !== undefined && sig !== cell.c*10+cell.s) return null;
    if (cell.o===3) return null;
    if (cell.o===1) {
      cell.hp = Math.max(0,(cell.hp||2)-1);
      if (!cell.hp) this.grid[i]=null;
      this.moves--; this.score += 0;
      if (this.moves<=0 && this.score<this.target) this.status='lost';
      this.gravity();
      return {by:player,at:[i%COLS,(i/COLS)|0],pts:0,duo:false,n:0,g:0,made:null,rem:[],obstacle:true};
    }
    let removed, pts, madeId = null, groupSize = 0;
    if (!cell.s){
      const grp = floodIdx(j => this.grid[j].s ? -1 : this.grid[j].c, i);
      if (grp.length < 2) return null;
      groupSize = grp.length;
      let toRemove = grp;
      if (grp.length >= 5){
        toRemove = grp.filter(j => j!==i);
        cell.c = -1;
        cell.s = grp.length>=9 ? SP.RAINBOW : grp.length>=7 ? SP.BOMB
               : (this.rng()<.5 ? SP.ROCKET_H : SP.ROCKET_V);
        madeId = cell.id;
      }
      removed = this.expand(toRemove);
      const chain = removed.size - toRemove.length;
      pts = grp.length*10 + Math.max(0, grp.length-3)*10 + chain*15;
    } else {
      removed = this.expand([i]);
      pts = removed.size*15;
    }
    if(this.scoreBoost>0&&this.boostCombos>0){pts*=this.scoreBoost;this.boostCombos--;if(!this.boostCombos)this.scoreBoost=0;}
    let duo = false;
    const other = 1-player;
    if (now - this.lastAct[other] <= DUO_WINDOW){ duo = true; pts = Math.floor(pts*DUO_MULT); }
    this.lastAct[player] = now;
    // Obstáculos atingidos por uma combinação perdem uma camada de resistência.
    const hit = new Set();
    for (const j of removed) {
      const c=j%COLS, r=(j/COLS)|0;
      for (const n of [c>0?j-1:-1,c<COLS-1?j+1:-1,r>0?j-COLS:-1,r<ROWS-1?j+COLS:-1]) {
        if (n>=0 && this.grid[n] && this.grid[n].o===1) hit.add(n);
      }
    }
    const rem = [...removed].filter(j=>this.grid[j] && this.grid[j].o!==3 && this.grid[j].o!==1).map(j => [this.grid[j].id, this.grid[j].c, this.grid[j].s, j%COLS, (j/COLS)|0]);
    for (const j of removed) if (this.grid[j] && this.grid[j].o!==3 && this.grid[j].o!==1) this.grid[j] = null;
    for (const j of hit) { this.grid[j].hp--; if (this.grid[j].hp<=0) this.grid[j]=null; }
    this.gravity();
    this.moves--; this.score += pts; this.ps[player] += pts;
    this.energy[player]=Math.min(100,(this.energy[player]||0)+removed.size*2);
    if (this.score >= this.target) {
      this.status = 'won'; this.awardRelic();
      const pool=['rocket','bomb','rainbow'];
      this.inventory[pool[Math.floor(this.rng()*pool.length)]]++;
      if(this.level%5===0) for(let k=0;k<2;k++) this.inventory[pool[Math.floor(this.rng()*pool.length)]]++;
    } else if (this.moves <= 0) this.status = 'lost';
    else if (!this.hasMove()) this.ensureMove();
    return {by:player, at:[i%COLS,(i/COLS)|0], pts, duo, n:removed.size, g:groupSize, made:madeId, rem};
  }
  gravity(){
    for (let c=0;c<COLS;c++){
      let bottom=ROWS-1;
      while (bottom>=0){
        if (this.grid[bottom] && (this.grid[bottom].o===1 || this.grid[bottom].o===3)){ bottom--; continue; }
        let top=bottom;
        while (top>=0 && !(this.grid[top] && (this.grid[top].o===1 || this.grid[top].o===3))) top--;
        const col=[];
        for(let r=bottom;r>top;r--) if(this.grid[r*COLS+c]) col.push(this.grid[r*COLS+c]);
        while(col.length<bottom-top) col.push(this.newCell());
        for(let r=bottom,k=0;r>top;r--,k++) this.grid[r*COLS+c]=col[k];
        bottom=top-1;
      }
    }
  }
  reshuffle(){
    for (let tries=0; tries<50 && !this.hasMove(); tries++){
      const idx = this.grid.map((g,i)=>i).filter(i=>!this.grid[i].s && !this.grid[i].o);
      const cols = idx.map(i=>this.grid[i].c);
      for (let k=cols.length-1;k>0;k--){ const j=Math.floor(this.rng()*(k+1)); [cols[k],cols[j]]=[cols[j],cols[k]]; }
      idx.forEach((i,k)=>{ this.grid[i].c = cols[k]; });
    }
    if (!this.hasMove()) for (const g of this.grid) if (!g.s && !g.o) g.c = 0;
  }
  useItem(type,id,player=0){
    if(this.status!=='play'||!this.inventory[type]) return null;
    const i=this.indexOfId(id); if(i<0) return null;
    const target=this.grid[i]; if(!target||target.c<0||target.o===1||target.o===3) return null;
    const remove=new Set();
    if(type==='rocket'){
      const row=(i/COLS)|0,col=i%COLS;
      for(let c=0;c<COLS;c++) remove.add(row*COLS+c);
      for(let r=0;r<ROWS;r++) remove.add(r*COLS+col);
    } else if(type==='bomb'){
      const row=(i/COLS)|0,col=i%COLS;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(Math.abs(r-row)+Math.abs(c-col)<=2) remove.add(r*COLS+c);
    } else if(type==='rainbow'){
      const color=target.c; for(let j=0;j<this.grid.length;j++) if(this.grid[j]&&this.grid[j].c===color&&this.grid[j].o!==1&&this.grid[j].o!==3) remove.add(j);
    } else return null;
    const actual=[...remove].filter(j=>this.grid[j]&&this.grid[j].c>=0&&this.grid[j].o!==1&&this.grid[j].o!==3);
    if(!actual.length) return null;
    this.inventory[type]--; const points=actual.length*8;
    for(const j of actual) this.grid[j]=null;
    this.gravity(); this.score+=points;
    this.energy[player]=Math.min(100,(this.energy[player]||0)+actual.length*2);
    if(this.score>=this.target){this.status='won';this.awardRelic();const pool=['rocket','bomb','rainbow'];this.inventory[pool[Math.floor(this.rng()*pool.length)]]++;if(this.level%5===0)for(let k=0;k<2;k++)this.inventory[pool[Math.floor(this.rng()*pool.length)]]++;}
    return {type,at:[i%COLS,(i/COLS)|0],n:actual.length,pts:points};
  }
  awardRelic(){if(this.level%5!==0)return;const keys=['apple','grape','orange','kiwi','blueberry'];const k=keys[(Math.floor(this.level/5)-1)%5];this.relics[k]=Math.min(4,(this.relics[k]||0)+1);}
  useRelic(key,id,player=0){if(this.status!=='play'||(this.energy[player]||0)<25||!this.relics[key])return null;const i=this.indexOfId(id);if(i<0||!this.grid[i]||this.grid[i].c<0||this.grid[i].o===1||this.grid[i].o===3)return null;const lv=this.relics[key],r=(i/COLS)|0,c=i%COLS,rm=new Set();if(key==='apple')this.moves+=Math.min(5,lv+1);if(key==='grape'){const d=lv===1?1:lv===2?2:lv===3?2:3;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(Math.abs(y-r)<=d&&Math.abs(x-c)<=d)rm.add(y*COLS+x);}if(key==='orange'){const n=lv>=3?1:0;for(let y=Math.max(0,r-n);y<=Math.min(ROWS-1,r+n);y++)for(let x=0;x<COLS;x++)rm.add(y*COLS+x);if(lv>=2)for(let x=Math.max(0,c-(lv===4?1:0));x<=Math.min(COLS-1,c+(lv===4?1:0));x++)for(let y=0;y<ROWS;y++)rm.add(y*COLS+x);}if(key==='kiwi'){this.scoreBoost=lv>=3?3:2;this.boostCombos=lv===4?6:lv===3?4:lv===2?5:3;}if(key==='blueberry'){const colors=[this.grid[i].c];if(lv>=3)for(const g of this.grid)if(g&&g.c>=0&&!colors.includes(g.c)&&colors.length<(lv===4?3:2))colors.push(g.c);for(let j=0;j<this.grid.length;j++)if(this.grid[j]&&colors.includes(this.grid[j].c))rm.add(j);}const a=[...rm].filter(j=>this.grid[j]&&this.grid[j].c>=0&&this.grid[j].o!==1&&this.grid[j].o!==3);for(const j of a)this.grid[j]=null;const pts=a.length*8;this.gravity();this.score+=pts;this.energy[player]=0;return {key,at:[c,r],n:a.length,pts,player};}

            st:this.status, nc:this.nc, solo:this.solo, nextId:this.nextId, rng:this.rng.getState(),

    game.status=s.st; game.nc=s.nc; game.nextId=s.nextId||1; game.inventory={rocket:0,bomb:0,rainbow:0,...(s.inv||{})};game.relics={apple:0,grape:0,orange:0,kiwi:0,blueberry:0,...(s.relics||{})};game.energy=Array.isArray(s.energy)?s.energy.slice(0,2):[s.energy||0,0];while(game.energy.length<2)game.energy.push(0);game.scoreBoost=s.scoreBoost||0;game.boostCombos=s.boostCombos||0;

/* ---------- desenho das frutas ---------- */
const TAU = Math.PI*2;
function ball(g,x,y,r,c1,c2){
  const gr = g.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
  gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
}
function gloss(g,x,y,r){
  g.fillStyle='rgba(255,255,255,.38)'; g.beginPath();
  g.ellipse(x-r*.38,y-r*.42,r*.28,r*.16,-.6,0,TAU); g.fill();
}
function leaf(g,x,y,len,ang,col){
  g.save(); g.translate(x,y); g.rotate(ang); g.fillStyle=col;
  g.beginPath(); g.ellipse(len/2,0,len/2,len*.28,0,0,TAU); g.fill(); g.restore();
}
function star(g,x,y,ro,ri,col,rot){
  g.fillStyle=col; g.beginPath();
  for (let i=0;i<10;i++){ const a=rot+i*Math.PI/5-Math.PI/2, rr=i%2?ri:ro;
    g[i?'lineTo':'moveTo'](x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  g.closePath(); g.fill();
}
function drawFruit(g, kind, x, y, r){
  switch(kind){
    case 0: // maçã
      ball(g,x,y+r*.08,r*.92,'#ff7a6e','#c62828');
      g.strokeStyle='#5d4037'; g.lineWidth=r*.12; g.lineCap='round'; g.beginPath();
      g.moveTo(x,y-r*.7); g.quadraticCurveTo(x+r*.05,y-r*1.0,x+r*.18,y-r*1.1); g.stroke();
      leaf(g,x+r*.1,y-r*.88,r*.5,-.5,'#66bb6a'); gloss(g,x,y,r*.9); break;
    case 1: // laranja
      ball(g,x,y+r*.05,r*.92,'#ffcc80','#ef6c00');
      leaf(g,x,y-r*.85,r*.45,-.9,'#7cb342');
      g.fillStyle='rgba(255,255,255,.22)';
      [[.3,.2],[-.4,.35],[.1,.55],[.45,-.15],[-.15,.05]].forEach(p=>{g.beginPath();g.arc(x+p[0]*r,y+p[1]*r,r*.05,0,TAU);g.fill();});
      gloss(g,x,y,r*.9); break;
    case 2: // uva
      g.strokeStyle='#5d4037'; g.lineWidth=r*.1; g.lineCap='round'; g.beginPath();
      g.moveTo(x,y-r*.7); g.lineTo(x+r*.12,y-r*1.0); g.stroke();
      leaf(g,x+r*.1,y-r*.92,r*.5,-.4,'#66bb6a');
      [[-.52,-.38],[0,-.38],[.52,-.38],[-.26,.1],[.26,.1],[0,.58]].forEach(p=>
        ball(g,x+p[0]*r,y+p[1]*r+r*.05,r*.37,'#ce93d8','#6a1b9a'));
      break;
    case 3: // limão
      g.save(); g.translate(x,y); g.rotate(-.5);
      const gr=g.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);
      gr.addColorStop(0,'#fff59d'); gr.addColorStop(1,'#f9a825');
      g.fillStyle=gr; g.beginPath(); g.ellipse(0,0,r*.98,r*.74,0,0,TAU); g.fill();
      g.fillStyle='#f9a825';
      g.beginPath(); g.arc(r*.97,0,r*.15,0,TAU); g.fill();
      g.beginPath(); g.arc(-r*.97,0,r*.15,0,TAU); g.fill();
      g.fillStyle='rgba(255,255,255,.4)'; g.beginPath(); g.ellipse(-r*.3,-r*.3,r*.3,r*.12,-.2,0,TAU); g.fill();
      g.restore(); break;
    case 4: // mirtilo
      ball(g,x,y+r*.05,r*.9,'#90caf9','#1565c0');
      star(g,x,y-r*.05,r*.3,r*.13,'#0d47a1',0); gloss(g,x,y,r*.9); break;
    default: // kiwi
      ball(g,x,y+r*.05,r*.9,'#c5e1a5','#558b2f');
      g.fillStyle='#dcedc8'; g.beginPath(); g.arc(x,y+r*.05,r*.6,0,TAU); g.fill();
      g.fillStyle='#f9fbe7'; g.beginPath(); g.arc(x,y+r*.05,r*.2,0,TAU); g.fill();
      g.fillStyle='#33411d';
      for (let i=0;i<9;i++){ const a=i*TAU/9; g.beginPath();
        g.ellipse(x+Math.cos(a)*r*.4,y+r*.05+Math.sin(a)*r*.4,r*.04,r*.09,a,0,TAU); g.fill(); }
      gloss(g,x,y,r*.9);
  }
}
function drawObstacle(g,o,hp,x,y,r){
  if(o===1){
    g.fillStyle='#8d5524'; roundRect(g,x-r*.78,y-r*.78,r*1.56,r*1.56,r*.15); g.fill();
    g.strokeStyle='#e6b36a'; g.lineWidth=r*.16; g.strokeRect(x-r*.62,y-r*.62,r*1.24,r*1.24);
    g.beginPath();g.moveTo(x-r*.55,y-r*.55);g.lineTo(x+r*.55,y+r*.55);g.moveTo(x+r*.55,y-r*.55);g.lineTo(x-r*.55,y+r*.55);g.stroke();
    g.fillStyle='#fff';g.font=`bold ${r*.65}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(String(hp||2),x,y);
  } else if(o===2){
    g.fillStyle='rgba(160,230,255,.48)';g.strokeStyle='#b9f2ff';g.lineWidth=r*.13;
    g.beginPath();g.roundRect(x-r*.86,y-r*.86,r*1.72,r*1.72,r*.2);g.fill();g.stroke();
    g.beginPath();g.moveTo(x-r*.45,y-r*.4);g.lineTo(x+r*.35,y+r*.42);g.moveTo(x+r*.4,y-r*.5);g.lineTo(x-r*.3,y+r*.45);g.stroke();
  } else if(o===3){
    g.fillStyle='#68717e';g.strokeStyle='#b0bec5';g.lineWidth=r*.12;
    g.beginPath();g.moveTo(x-r*.8,y-r*.35);g.lineTo(x-r*.45,y-r*.8);g.lineTo(x+r*.35,y-r*.75);g.lineTo(x+r*.8,y-r*.2);g.lineTo(x+r*.65,y+r*.65);g.lineTo(x-r*.35,y+r*.8);g.closePath();g.fill();g.stroke();
  }
}
function drawSpecial(g, s, x, y, r, t){
  if (s===SP.ROCKET_H || s===SP.ROCKET_V){
    ball(g,x,y,r*.98,'#ffe082','#ff8f00');
    g.save(); g.translate(x,y); g.rotate(s===SP.ROCKET_H ? Math.PI/2 : 0);
    g.fillStyle='#eceff1'; g.beginPath(); g.ellipse(0,0,r*.3,r*.58,0,0,TAU); g.fill();
    g.fillStyle='#e53935';
    g.beginPath(); g.moveTo(-r*.29,-r*.26); g.lineTo(0,-r*.82); g.lineTo(r*.29,-r*.26); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-r*.27,r*.18); g.lineTo(-r*.56,r*.6); g.lineTo(-r*.2,r*.46); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(r*.27,r*.18); g.lineTo(r*.56,r*.6); g.lineTo(r*.2,r*.46); g.closePath(); g.fill();
    g.fillStyle='#ff6d00'; g.beginPath(); g.moveTo(-r*.14,r*.55); g.lineTo(0,r*(.9+.08*Math.sin(t*20))); g.lineTo(r*.14,r*.55); g.closePath(); g.fill();
    g.fillStyle='#42a5f5'; g.beginPath(); g.arc(0,-r*.08,r*.14,0,TAU); g.fill();
    g.strokeStyle='#fff'; g.lineWidth=r*.04; g.stroke();
    g.restore();
    // setas indicando o eixo
    g.fillStyle='rgba(60,30,0,.75)';
    const d = s===SP.ROCKET_H ? [[1,0],[-1,0]] : [[0,1],[0,-1]];
    d.forEach(v=>{ const bx=x+v[0]*r*.93, by=y+v[1]*r*.93, a=Math.atan2(v[1],v[0]);
      g.save(); g.translate(bx,by); g.rotate(a); g.beginPath(); g.moveTo(r*.14,0); g.lineTo(-r*.08,-r*.14); g.lineTo(-r*.08,r*.14); g.closePath(); g.fill(); g.restore(); });
  } else if (s===SP.BOMB){
    ball(g,x,y+r*.1,r*.78,'#78909c','#1c2327'); gloss(g,x,y+r*.1,r*.78);
    g.strokeStyle='#8d6e63'; g.lineWidth=r*.09; g.lineCap='round'; g.beginPath();
    g.moveTo(x+r*.25,y-r*.55); g.quadraticCurveTo(x+r*.5,y-r*.75,x+r*.45,y-r*.98); g.stroke();
    star(g,x+r*.45,y-r*1.0,r*(.24+.06*Math.sin(t*18)),r*.1,'#ffeb3b',t*3);
  } else if (s===SP.RAINBOW){
    const cols=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#5e35b1','#d81b60'];
    const sp=t*1.2;
    for (let i=0;i<7;i++){ g.fillStyle=cols[i]; g.beginPath(); g.moveTo(x,y);
      g.arc(x,y,r*.95,sp+i*TAU/7,sp+(i+1)*TAU/7); g.closePath(); g.fill(); }
    g.fillStyle='#fff'; g.beginPath(); g.arc(x,y,r*.3,0,TAU); g.fill();
    star(g,x,y,r*.28,r*.12,'#ffd54f',t); gloss(g,x,y,r*.95);
    g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=r*.06; g.beginPath(); g.arc(x,y,r*.95,0,TAU); g.stroke();
  }
}

let AC=null, muted=false;
function unlockAudio(){
  if (!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if (AC && AC.state==='suspended') AC.resume();
}
function tone(f,d=.12,type='sine',vol=.12,slide=0,delay=0){
  if (muted||!AC) return;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
}
const sfx = {

  special:()=>{ tone(180,.35,'sawtooth',.09,4); tone(620,.2,'triangle',.1,2,.05); },
  nope:()=>tone(150,.09,'square',.05),
  duo:()=>{ tone(784,.1,'triangle',.1); tone(1175,.16,'triangle',.1,1,.08); },
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.12,1,i*.12)),

};

/* ---------- renderização ---------- */
const cv = document.getElementById('board'), ctx = cv.getContext('2d');
let W=0,H=0,cs=40,ox=0,oy=0,dpr=1;
const sprites = new Map(), dying = [], particles = [], rings = [], floaters = [];
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2.5);
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(1,Math.round(r.width*dpr)); cv.height = Math.max(1,Math.round(r.height*dpr));
  W = r.width; H = r.height;
  cs = Math.floor(Math.min(W/COLS, H/ROWS)); ox = (W-cs*COLS)/2; oy = Math.max(8,(H-cs*ROWS)*.38);
}
window.addEventListener('resize', resize);

function syncSprites(snap){
  const seen = new Set();
  snap.g.forEach((e,i)=>{
    const [id,c,s] = e, col = i%COLS, row = (i/COLS)|0;
    let sp = sprites.get(id);
    if (!sp){
      sp = {id, c, s, o:e[3]||0, hp:e[4]||0, x:col, y:row-ROWS-1-Math.random()*2.5, vy:0, col, row, bump:0, shake:0};
      sprites.set(id, sp);
    } else if (sp.s!==s || sp.c!==c){ sp.bump = 1; }
    sp.c = c; sp.s = s; sp.o=e[3]||0; sp.hp=e[4]||0; sp.col = col; sp.row = row; seen.add(id);
  });
  for (const [id,sp] of sprites) if (!seen.has(id)){
    dying.push({sp, t:0});
    const color = sp.s ? '#ffd54f' : FRUIT_COLOR[sp.c] || '#fff';
    for (let k=0;k<6 && particles.length<400;k++){
      const a=Math.random()*TAU, v=1.5+Math.random()*3.5;
      particles.push({x:sp.x+.5,y:sp.y+.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:0,max:.45+Math.random()*.3,color,size:.07+Math.random()*.07});
    }
    sprites.delete(id);
  }
}
function addRing(col,row,player,big){
  rings.push({x:col+.5,y:row+.5,t:0,color:P_COLOR[player],big});
}
function addFloater(col,row,text,color,size){
  floaters.push({x:col+.5,y:row+.3,t:0,text,color,size:size||1});
}
function roundRect(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
let lastT = performance.now();
function frame(now){
  const dt = Math.min(.05,(now-lastT)/1000); lastT = now; const t = now/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  // painel
  ctx.fillStyle='rgba(255,255,255,.07)'; roundRect(ctx,ox-6,oy-6,cs*COLS+12,cs*ROWS+12,16); ctx.fill();
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    if ((r+c)%2===0){ ctx.fillStyle='rgba(255,255,255,.045)'; ctx.fillRect(ox+c*cs,oy+r*cs,cs,cs); }
  }
  ctx.save(); ctx.beginPath(); ctx.rect(ox-2,oy-2,cs*COLS+4,cs*ROWS+4); ctx.clip();
  // física
  for (const sp of sprites.values()){
    sp.x += (sp.col-sp.x)*Math.min(1,dt*14);
    if (sp.y < sp.row){
      sp.vy += 40*dt; sp.y += sp.vy*dt;
      if (sp.y >= sp.row){ sp.y = sp.row; sp.vy = sp.vy>6 ? -sp.vy*.2 : 0; }
    } else if (sp.y > sp.row){
      if (sp.vy < 0){ sp.vy += 40*dt; sp.y += sp.vy*dt; if (sp.y>sp.row){ sp.y=sp.row; sp.vy=0; } }
      else sp.y += (sp.row-sp.y)*Math.min(1,dt*12);
    }
    if (sp.bump>0) sp.bump = Math.max(0,sp.bump-dt*4);
    if (sp.shake>0) sp.shake = Math.max(0,sp.shake-dt*5);
  }
  // desenhar
  for (const sp of sprites.values()){
    let sc = 1 + sp.bump*.3, pulse = sp.s ? 1+.05*Math.sin(t*5+sp.id) : 1;
    const sx = sp.shake ? Math.sin(sp.shake*40)*sp.shake*.08 : 0;
    const cx = ox + (sp.x+.5+sx)*cs, cy = oy + (sp.y+.5)*cs;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(sc*pulse,sc*pulse);
    if (sp.s) drawSpecial(ctx,sp.s,0,0,cs*.43,t); else if(sp.c>=0) drawFruit(ctx,sp.c,0,0,cs*.42);
    if(sp.o) drawObstacle(ctx,sp.o,sp.hp,0,0,cs*.46);
    ctx.restore();
  }
  for (let i=dying.length-1;i>=0;i--){
    const d = dying[i]; d.t += dt; const k = d.t/.24;
    if (k>=1){ dying.splice(i,1); continue; }
    const sp = d.sp, cx = ox+(sp.x+.5)*cs, cy = oy+(sp.y+.5)*cs, sc = 1+k*.45;
    ctx.save(); ctx.globalAlpha = 1-k; ctx.translate(cx,cy); ctx.scale(sc,sc);
    if (sp.s) drawSpecial(ctx,sp.s,0,0,cs*.43,t); else drawFruit(ctx,sp.c,0,0,cs*.42);
    ctx.restore();
  }
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.life += dt; if (p.life>=p.max){ particles.splice(i,1); continue; }
    p.vy += 9*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    ctx.globalAlpha = 1-p.life/p.max; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(ox+p.x*cs,oy+p.y*cs,p.size*cs,0,TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i=rings.length-1;i>=0;i--){
    const r = rings[i]; r.t += dt; const dur = r.big?.7:.4; if (r.t>=dur){ rings.splice(i,1); continue; }
    const k = r.t/dur;
    ctx.strokeStyle = r.color; ctx.globalAlpha = 1-k; ctx.lineWidth = (r.big?5:3);
    ctx.beginPath(); ctx.arc(ox+r.x*cs,oy+r.y*cs,cs*(.25+k*(r.big?.75:.5)),0,TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // textos flutuantes (fora do clip)
  for (let i=floaters.length-1;i>=0;i--){
    const f = floaters[i]; f.t += dt; if (f.t>=1.1){ floaters.splice(i,1); continue; }
    const k = f.t/1.1;
    ctx.globalAlpha = k<.7 ? 1 : 1-(k-.7)/.3;
    ctx.font = `800 ${Math.round(cs*.5*f.size)}px system-ui,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const x = ox+f.x*cs, y = oy+f.y*cs - k*cs*1.1;
    ctx.lineWidth = 5; ctx.strokeStyle='rgba(20,5,45,.85)'; ctx.strokeText(f.text,x,y);
    ctx.fillStyle = f.color; ctx.fillText(f.text,x,y);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

const App = {
  mode:'menu',      // menu | solo | host | guest
  me:0, game:null, snap:null, idxById:new Map(), selectedItem:null, selectedRelic:null,
  status:'play', dc:null, pc:null, lastRx:0, hb:null, connected:false, resultTimer:null
};
const $ = id => document.getElementById(id);


const BOSS_VISUALS = [
  {name:'Rei Maçã',emoji:'🍎👑',desc:'O rei das frutas chegou para desafiar a equipe!',tone:'#ef5350'},
  {name:'Dragão de Uva',emoji:'🐉🍇',desc:'Um dragão roxo protege o reino das uvas!',tone:'#9c55d7'},
  {name:'Laranja Colossal',emoji:'🍊💪',desc:'Força bruta e punhos cítricos!',tone:'#ff9d32'},
  {name:'Guardião Kiwi',emoji:'🥝🛡️',desc:'O guerreiro kiwi defende seu território!',tone:'#8bc34a'},
  {name:'Titã Mirtilo',emoji:'🫐👑',desc:'O titã azul desperta para a batalha!',tone:'#4778ed'}
];
function updateBossBanner(level){
  const panel=$('bossBanner'); if(!panel)return;
  if(level%5!==0){panel.classList.remove('on');return;}
  const index=(Math.floor(level/5)-1)%BOSS_VISUALS.length, boss=BOSS_VISUALS[index];
  $('bossAvatar').textContent=boss.emoji;
  $('bossAvatar').style.background='radial-gradient(circle at 35% 25%,#fff7c2,'+boss.tone+' 55%,#28104e 100%)';
  $('bossName').textContent=boss.name;
  $('bossDesc').textContent=boss.desc;
  panel.classList.add('on');
}

function updateHUD(s){
  $('lv').textContent = s.lv; $('mv').textContent = s.mv; updateBossBanner(s.lv);
  const inv=s.inv||{rocket:0,bomb:0,rainbow:0};const rel=s.relics||{};for(const k of ['apple','grape','orange','kiwi','blueberry'])$('rel'+k[0].toUpperCase()+k.slice(1)).textContent=rel[k]||0;const energies=Array.isArray(s.energy)?s.energy:[s.energy||0,0];$('relEnergy0').textContent=energies[App.me]||0;$('relEnergy1').textContent=energies[1-App.me]||0;document.querySelectorAll('.relic').forEach(b=>{b.disabled=!((rel[b.dataset.relic]||0)>0);b.classList.toggle('selected',App.selectedRelic===b.dataset.relic);}); $('invRocket').textContent=inv.rocket||0; $('invBomb').textContent=inv.bomb||0; $('invRainbow').textContent=inv.rainbow||0;
  document.querySelectorAll('.inv').forEach(b=>{const type=b.dataset.item;b.disabled=!(inv[type]>0);b.classList.toggle('selected',App.selectedItem===type);});
  $('sc').textContent = s.sc; $('tg').textContent = s.tg;
  const tot = Math.max(s.tg, s.ps[0]+s.ps[1]);
  $('b0').style.width = (s.ps[0]/tot*100)+'%'; $('b1').style.width = (s.ps[1]/tot*100)+'%';
  const pl = $('players');
  if (App.mode==='host' || App.mode==='guest'){
    const meI = App.me, thI = 1-App.me;
    pl.innerHTML =
      `<span><i class="dot" style="background:${P_COLOR[meI]}"></i>Você ${s.ps[meI]}</span>`+
      `<span><i class="dot" style="background:${P_COLOR[thI]}"></i>Parceiro ${s.ps[thI]}</span>`;
  } else pl.innerHTML = '';
}

const SAVE_KEY='fruta-duo-save-v1';
function readSave(){ try{ const raw=localStorage.getItem(SAVE_KEY); return raw?JSON.parse(raw):null; }catch(e){return null;} }
function saveProgress(snap){ try{ if((App.mode==='solo'||App.mode==='host') && snap) localStorage.setItem(SAVE_KEY,JSON.stringify(snap)); }catch(e){} }
function clearSave(){ try{localStorage.removeItem(SAVE_KEY);}catch(e){} }

/* aplica um estado (snapshot) + evento opcional */
function present(snap, ev){
  App.snap = snap; App.idxById = new Map(snap.g.map((e,i)=>[e[0],i])); saveProgress(snap);
  syncSprites(snap); updateHUD(snap);
  if (ev){
    if (App.mode!=='solo' && ev.by!==App.me) addRing(ev.at[0],ev.at[1],ev.by,true);
    if (ev.pts){ addFloater(ev.at[0],ev.at[1],'+'+ev.pts,P_COLOR[ev.by],ev.pts>=200?1.3:1); }
    if (ev.duo){ addFloater(COLS/2-.5,1.2,'DUO! ×'+DUO_MULT,'#ffd54f',1.6); sfx.duo(); }
    if (ev.made!==null) sfx.special(); else sfx.pop(ev.n);
  }
  if (snap.st !== App.status){
    App.status = snap.st;
    clearTimeout(App.resultTimer);
    if (snap.st==='play') hideOverlay();
    else App.resultTimer = setTimeout(()=>showResult(snap), 750);
  }
}

/* ---------- entrada do jogador ---------- */
function cellAtPointer(e){
  const r = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX-r.left-ox)/cs), rr = Math.floor((e.clientY-r.top-oy)/cs);
  if (c<0||c>=COLS||rr<0||rr>=ROWS) return null;
  return {c, r:rr, i:rr*COLS+c};
}
cv.addEventListener('pointerdown', e=>{
  e.preventDefault(); unlockAudio();
  if (App.mode==='menu' || !App.snap || App.snap.st!=='play') return;
  const h = cellAtPointer(e); if (!h) return;
  if(App.selectedItem){doUseItem(App.selectedItem,App.snap.g[h.i][0]);return;}
  if(App.selectedRelic){doUseRelic(App.selectedRelic,App.snap.g[h.i][0]);return;}
  const cell = App.snap.g[h.i], sp = sprites.get(cell[0]);
  const valid = cell[3]===1 || cell[3]===3 ? cell[3]===1 : (cell[2] || floodIdx(j => App.snap.g[j][2] || App.snap.g[j][3]===1 || App.snap.g[j][3]===3 ? -1 : App.snap.g[j][1], h.i).length >= 2);
  addRing(h.c,h.r,App.me,false);
  if (!valid){ if (sp) sp.shake = 1; sfx.nope(); return; }
  if (navigator.vibrate) navigator.vibrate(12);
  doTap(cell[0], App.me, cell[1]*10+cell[2]);
});
function doUseItem(type,id){
  if(App.mode==='guest'){App.selectedItem=null;updateHUD(App.snap);send({t:'useItem',type,id,player:App.me});return;}
  const ev=App.game&&App.game.useItem(type,id,App.me);if(!ev){sfx.nope();return;}
  App.selectedItem=null;const snap=App.game.snapshot();if(App.mode==='host')send({t:'s',s:snap});present(snap);addFloater(ev.at[0],ev.at[1],'-'+ev.n+' 🍓','#ffd54f',1.15);sfx.special();
}
document.querySelectorAll('.inv').forEach(b=>b.addEventListener('click',()=>{unlockAudio();const type=b.dataset.item;if(!(App.snap&&App.snap.inv&&App.snap.inv[type]>0))return;App.selectedItem=App.selectedItem===type?null:type;updateHUD(App.snap);}));
function doUseRelic(key,id){if(App.mode==='guest'){App.selectedRelic=null;updateHUD(App.snap);send({t:'useRelic',key,id,player:App.me});return;}const ev=App.game&&App.game.useRelic(key,id,App.me);if(!ev){sfx.nope();return;}App.selectedRelic=null;const snap=App.game.snapshot();if(App.mode==='host')send({t:'s',s:snap});present(snap);addFloater(ev.at[0],ev.at[1],ev.key==='apple'?'+jogadas':'-'+ev.n+' frutas','#ffd54f',1.2);sfx.special();}
const RELIC_INFO={apple:'🍎 Maçã: adiciona jogadas. Evolução: concede mais jogadas extras.',grape:'🍇 Uva: explode frutas em uma área ao redor do ponto escolhido. Evolução: aumenta o alcance.',orange:'🍊 Laranja: limpa linhas e colunas. Evolução: atinge mais linhas e colunas.',kiwi:'🥝 Kiwi: multiplica os pontos das próximas combinações. Evolução: aumenta o multiplicador e a duração.',blueberry:'🫐 Mirtilo: elimina frutas da cor escolhida. Evolução: pode eliminar até 3 cores.'};
document.querySelectorAll('.relic').forEach(b=>b.addEventListener('click',()=>{unlockAudio();const k=b.dataset.relic,lv=(App.snap&&App.snap.relics&&App.snap.relics[k])||0;const energy=App.snap?(Array.isArray(App.snap.energy)?App.snap.energy[App.me]||0:App.snap.energy||0):0;$('relicInfo').textContent=RELIC_INFO[k]+' Nível '+lv+'/4. Energia deste jogador: '+energy+'%. '+(energy>=25?'Toque novamente para selecionar e depois escolha uma fruta.':'A energia é carregada pelas frutas que você estoura. Precisa de 25%.');if(!App.snap||!lv||energy<100)return;App.selectedRelic=App.selectedRelic===k?null:k;App.selectedItem=null;updateHUD(App.snap);}));
function doTap(id, player, sig){
  if (App.mode==='guest'){ send({t:'tap', id, sig}); return; }
  const ev = App.game.tap(id, player, performance.now(), sig);
  if (!ev) return;
  const snap = App.game.snapshot();
  if (App.mode==='host') send({t:'s', s:snap, e:ev});
  present(snap, ev);
}

/* ---------- telas / overlay ---------- */
const ov = $('overlay');
function showOverlay(html){ ov.innerHTML = '<div class="card">'+html+'</div>'; ov.classList.add('on'); }
function hideOverlay(){ ov.classList.remove('on'); ov.innerHTML=''; }

function showMenu(){
  App.mode='menu'; App.snap=null; App.status='play';
  showOverlay(`
    <h1>🍓 Fruta Duo</h1>
    <p class="sub">Puzzle de frutas para fazer em dupla — os dois jogam ao mesmo tempo!</p>
    ${readSave()?`<button class="btn pri" data-act="continue">Continuar fase ${readSave().lv}</button>`:''}
    <button class="btn" data-act="solo">Novo jogo (solo ou 2 no mesmo celular)</button>
    <button class="btn pri" data-act="host">Criar sala · 2 celulares</button>
    <button class="btn" data-act="join">Entrar na sala</button>
    <p class="hint">Toque em 2 ou mais frutas iguais coladas para estourar. Grupos de 5+ criam especiais:
    foguete (linha/coluna), bomba e arco-íris (limpa uma cor). Caixas aparecem na fase 4, gelo na 8 e pedras na 12. Para jogar em 2 celulares, ambos precisam estar no mesmo Wi-Fi.</p>`);
}
function showResult(snap){
  const won = snap.st==='won';
  if (won) sfx.win(); else sfx.lose();
  const two = App.mode!=='solo';
  const me = App.me, th = 1-App.me;
  showOverlay(`
    <p class="big">${won?'🎉':'😵'}</p>
    <h2>${won?'Fase '+snap.lv+' concluída!':'Acabaram as jogadas'}</h2>
    <p>Equipe: <b>${snap.sc}</b> / ${snap.tg} pontos${won&&snap.mv>0?` · sobraram ${snap.mv} jogadas`:''}</p>
    ${two?`<div class="res"><div><i class="dot" style="background:${P_COLOR[me]}"></i> Você<b>${snap.ps[me]}</b></div>
    <div><i class="dot" style="background:${P_COLOR[th]}"></i> Parceiro<b>${snap.ps[th]}</b></div></div>`:''}
    <button class="btn pri" data-act="${won?'next':'retry'}">${won?'Próxima fase':'Tentar de novo'}</button>
    <button class="link" data-act="menu">Menu</button>`);
}
ov.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if (!b) return;
  unlockAudio();
  const a = b.dataset.act;
  if (a==='solo') startSolo(false);
  else if (a==='continue') startSolo(true);
  else if (a==='host') lobbyHost();
  else if (a==='join') lobbyJoin();
  else if (a==='menu'){ resetNet(); showMenu(); }
  else if (a==='next' || a==='retry') command(a);
  else if (a==='copyOut') copyText($('codeOut'));
  else if (a==='copyRoom') { const code=$('roomCode').textContent; if(navigator.clipboard) navigator.clipboard.writeText(code).then(()=>setLobbyMsg('Código copiado!')); else setLobbyMsg('Anote o código: '+code); }
  else if (a==='shareOut') shareText($('codeOut'));
  else if (a==='hostConnect') hostConnect();
  else if (a==='guestGen') guestGen();
});
$('snd').addEventListener('click', ()=>{ unlockAudio(); muted=!muted; $('snd').textContent = muted?'🔇':'🔊'; });

function command(a){
  if (App.mode==='guest'){ send({t:'cmd', a}); return; }
  hostCommand(a);
}
function hostCommand(a){
  const g = App.game; if (!g) return;
  App.selectedItem=null;
  if (a==='next' && g.status==='won') g.start(g.level+1);
  else if (a==='retry' && g.status==='lost') g.start(g.level);
  else return;
  const snap = g.snapshot();
  if (App.mode==='host') send({t:'s', s:snap});
  present(snap);
}

function startSolo(resume=false){
  resetNet(); App.mode='solo'; App.me=0;
  const saved=resume?readSave():null;
  App.game=saved?Game.restore(saved):new Game(0, true);
  if(!saved) clearSave();
  clearBoard(); hideOverlay(); present(App.game.snapshot());
  keepAwake();
}
function clearBoard(){ sprites.clear(); dying.length=0; particles.length=0; rings.length=0; floaters.length=0; App.status='play'; }
async function keepAwake(){ try{ if (navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }

/* ---------- conexão entre celulares (WebRTC, sem servidor) ---------- */
function b64u(bytes){
  let s=''; for (let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64u(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/'); while (str.length%4) str+='=';
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out;
}
async function pack(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream !== 'undefined'){
    const c = new CompressionStream('deflate-raw'), w = c.writable.getWriter();
    w.write(bytes); w.close();
    return 'FD1.'+b64u(new Uint8Array(await new Response(c.readable).arrayBuffer()))+'~';
  }
  return 'FD0.'+b64u(bytes)+'~';
}
async function unpack(text){
  // o código termina em "~", então textos extras antes/depois (ex.: mensagem do WhatsApp) são ignorados
  const m = /FD([01])\.([A-Za-z0-9_\s-]+)~/.exec(text);
  if (!m) throw new Error('Código inválido ou incompleto. Copie o código inteiro, até o final (~).');
  const raw = unb64u(m[2].replace(/\s+/g,''));
  if (m[1]==='0') return JSON.parse(new TextDecoder().decode(raw));
  if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador não abre o código. Atualize o Chrome.');
  const d = new DecompressionStream('deflate-raw'), w = d.writable.getWriter();
  w.write(raw); w.close();
  return JSON.parse(new TextDecoder().decode(await new Response(d.readable).arrayBuffer()));
}
function waitIce(pc){
  return new Promise(res=>{
    if (pc.iceGatheringState==='complete') return res();
    const done = ()=>{ pc.removeEventListener('icegatheringstatechange',chk); res(); };
    const chk = ()=>{ if (pc.iceGatheringState==='complete') done(); };
    pc.addEventListener('icegatheringstatechange',chk);
    setTimeout(done, 4000);
  });
}
function newPC(){
  const pc = new RTCPeerConnection({iceServers:[]});
  pc.onconnectionstatechange = ()=>{
    if (pc.connectionState==='failed'){ netLost('Não foi possível conectar. Verifique se os dois estão no mesmo Wi-Fi (redes de visitantes bloqueiam isso) e tente de novo.'); }
  };
  return pc;
}
function resetNet(){
  clearInterval(App.hb); App.hb=null; App.connected=false;
  try{if(window.AndroidLan)window.AndroidLan.stop();}catch(e){}
  try{ App.dc && App.dc.close(); }catch(e){}
  try{ App.pc && App.pc.close(); }catch(e){}
  App.dc=null; App.pc=null;
}
function send(obj){
  try{ if (App.dc && App.dc.readyState==='open') App.dc.send(JSON.stringify(obj)); }catch(e){}
}
function setupDC(dc){
  App.dc = dc;
  dc.onopen = ()=>onConnected();
  dc.onclose = ()=>{ if (App.connected) netLost('A conexão com o parceiro caiu.'); };
  dc.onmessage = ev=>{
    App.lastRx = performance.now();
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    onMessage(m);
  };
}
function onConnected(){
  App.connected = true; App.lastRx = performance.now();
  clearBoard();
  App.hb = setInterval(()=>{
    send({t:'p'});
    if (performance.now()-App.lastRx > 8000) netLost('Perdi o contato com o parceiro.');
  }, 2000);
  if (App.mode==='host'){
    App.me = 0; const saved=readSave(); App.game = (saved && !saved.solo)?Game.restore(saved):new Game();
    hideOverlay(); const snap = App.game.snapshot(); send({t:'s', s:snap}); present(snap);
  } else {
    App.me = 1; send({t:'hello'});
    $('players').innerHTML = '';
  }
  keepAwake();
}
function onMessage(m){
  if (m.t==='s'){ if (App.mode==='guest'){ if (ov.classList.contains('on') && m.s.st==='play') hideOverlay(); present(m.s, m.e); } }
  else if (m.t==='tap'){ if (App.mode==='host') doTap(m.id, 1, m.sig); }
  else if (m.t==='useItem'){if(App.mode==='host'){const ev=App.game&&App.game.useItem(m.type,m.id,m.player===1?1:0);if(ev){const snap=App.game.snapshot();send({t:'s',s:snap});present(snap);addFloater(ev.at[0],ev.at[1],'-'+ev.n+' 🍓','#ffd54f',1.15);sfx.special();}}}
  else if (m.t==='useRelic'){if(App.mode==='host'){const ev=App.game&&App.game.useRelic(m.key,m.id,m.player===1?1:0);if(ev){const snap=App.game.snapshot();send({t:'s',s:snap});present(snap);addFloater(ev.at[0],ev.at[1],ev.key==='apple'?'+jogadas':'-'+ev.n+' frutas','#ffd54f',1.2);sfx.special();}}}
  else if (m.t==='cmd'){ if (App.mode==='host') hostCommand(m.a); }
  else if (m.t==='hello'){ if (App.mode==='host' && App.game) send({t:'s', s:App.game.snapshot()}); }
}
function netLost(msg){
  if (App.mode==='menu') return;
  const was = App.connected; resetNet();
  showOverlay(`<p class="big">📡</p><h2>${was?'Conexão perdida':'Falha ao conectar'}</h2><p class="err">${msg}</p>
    <button class="btn pri" data-act="menu">Voltar ao menu</button>`);
}

function copyText(el){
  el.focus(); el.select(); el.setSelectionRange(0, 99999);
  let ok=false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(el.value).catch(()=>{});
  setLobbyMsg('Código copiado!');
}
function shareText(el){
  if (navigator.share) navigator.share({text:el.value}).catch(()=>{}); else copyText(el);
}
function setLobbyMsg(t,err){ const s=$('st'); if (s){ s.textContent=t; s.className='hint'+(err?' err':''); } }

function roomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let out='';for(let i=0;i<5;i++)out+=chars[Math.floor(Math.random()*chars.length)];return out;}
async function lobbyHost(){
  resetNet(); App.mode='host';
  const code=roomCode();
  showOverlay(`<h2>Criar sala</h2><p>Compartilhe este código com quem vai jogar com você:</p>
    <div style="font-size:38px;font-weight:900;letter-spacing:8px;color:#ffd54f;padding:12px" id="roomCode">${code}</div>
    <button class="btn pri" data-act="copyRoom">Copiar código</button>
    <p id="st" class="hint">Preparando sala na rede Wi-Fi…</p>
    <p class="hint">O outro celular deve escolher “Entrar na sala” e digitar os 5 caracteres. Não precisa de internet.</p>
    <button class="link" data-act="menu">Cancelar</button>`);
  try{
    const pc=App.pc=newPC();setupDC(pc.createDataChannel('game'));
    await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);
    if(!window.AndroidLan) throw new Error('Esta conexão automática funciona no aplicativo Android instalado.');
    window.AndroidLan.host(code,pc.localDescription.sdp);
    setLobbyMsg('Sala '+code+' aberta. Aguardando o parceiro…');
  }catch(e){setLobbyMsg('Erro ao criar sala: '+e.message,true);}
}
async function lobbyJoin(){
  resetNet();App.mode='guest';
  showOverlay(`<h2>Entrar na sala</h2><p>Digite o código de 5 caracteres:</p>
    <input id="roomInput" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="Ex.: A7K2P" style="width:100%;padding:15px;text-align:center;font-size:26px;letter-spacing:7px;border-radius:12px;border:1px solid #ffffff55;background:#170d30;color:white;text-transform:uppercase">
    <button class="btn pri" data-act="guestGen">Procurar sala</button>
    <p id="st" class="hint">Os dois celulares precisam estar na mesma rede Wi-Fi.</p>
    <button class="link" data-act="menu">Voltar</button>`);
}
async function guestGen(){
  const code=($('roomInput').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!/^[A-HJ-NP-Z2-9]{5}$/.test(code)){setLobbyMsg('Digite os 5 caracteres do código.',true);return;}
  if(!window.AndroidLan){setLobbyMsg('A conexão automática exige o aplicativo Android instalado.',true);return;}
  setLobbyMsg('Procurando a sala '+code+' na rede local…');
  window.AndroidLan.join(code);
}
window.onLanOffer=async function(sdp){
  try{
    const pc=App.pc=newPC();pc.ondatachannel=e=>setupDC(e.channel);
    await pc.setRemoteDescription({type:'offer',sdp});
    await pc.setLocalDescription(await pc.createAnswer());
    window.AndroidLan.answer(pc.localDescription.sdp);
    setLobbyMsg('Resposta enviada. Conectando…');
  }catch(e){setLobbyMsg('Erro ao entrar: '+e.message,true);}
};
window.onLanAnswer=async function(sdp){
  try{await App.pc.setRemoteDescription({type:'answer',sdp});setLobbyMsg('Conectando ao parceiro…');}
  catch(e){setLobbyMsg('Erro na resposta: '+e.message,true);}
};
window.onLanError=function(message){setLobbyMsg(message||'Falha na conexão local.',true);};


/* ---------- início ---------- */
window.FD = {Game, App, sprites, floodIdx, present, startSolo};
resize(); requestAnimationFrame(frame); showMenu();
new ResizeObserver(resize).observe(cv);
</script>
